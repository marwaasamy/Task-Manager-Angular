<div class="container d-flex justify-content-center mt-5">
  <div class="card shadow-lg p-4 text-center rounded-4" style="max-width: 500px; width: 100%;">

    <div class="d-flex justify-content-center align-items-center gap-4">

      <button class="btn btn-outline-primary rounded-circle" (click)="prev()">
        <i class="bi bi-caret-left-fill"></i>
      </button>

      <img 
        [src]="currentImage" 
        class="img-fluid rounded-4 border shadow-sm"
        style="width: 250px; height: 250px; object-fit: cover;"
      >

      <button class="btn btn-outline-primary rounded-circle" (click)="next()">
        <i class="bi bi-caret-right-fill"></i>
      </button>

    </div>

    <!-- <div class="mt-4 d-flex justify-content-center gap-3">
      <button class="btn btn-success px-4" (click)="slideShow()">Start</button>
      <button class="btn btn-danger px-4" (click)="stop()">Stop</button>
    </div> -->

    <div class="mt-4 d-flex justify-content-center gap-2">
      @for(i of images;track i; let idx = $index){
        <span 
          class="rounded-circle border border-primary"
          [class.bg-primary]="idx==index"
          (click)="GetImage(idx)"
          style="width:14px; height:14px; cursor:pointer; display:inline-block;">
        </span>
      }
    </div>

  </div>
</div>
